name: event-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: event_platform
      POSTGRES_PASSWORD: event_platform
      POSTGRES_USER: event_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U event_platform -d event_platform']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
