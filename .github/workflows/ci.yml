name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://event_platform:event_platform@localhost:5432/event_platform?schema=public
  APP_PUBLIC_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:3000
  JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
  NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
  QR_SIGNING_SECRET: ci-only-qr-secret-separate-from-jwt-32-characters
  TMDB_API_READ_TOKEN: ci-not-used

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: event_platform
          POSTGRES_PASSWORD: event_platform
          POSTGRES_USER: event_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_platform -d event_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - name: API integration tests
        run: pnpm --filter @event-platform/api test:e2e --runInBand
      - name: Install Playwright Chromium
        run: pnpm --filter @event-platform/e2e exec playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: pnpm test:e2e:web
